# ==============================================================================
# GitHub Actions Workflow — Автоматическое тестирование проекта Taski
# ==============================================================================
# Этот файл задаёт сценарий непрерывной интеграции (CI — Continuous Integration).
# Каждый раз при отправке кода на GitHub, система создаёт чистую виртуальную
# машину (Runner), автоматически выполняет проверки и убеждается, что код исправен.
# ==============================================================================

# Название рабочего процесса (отображается во вкладке Actions на GitHub)
name: Main Taski workflow

# 1. ТРИГГЕРЫ (Когда запускать этот рабочий процесс?)
on:
  push:
    branches:
      # Запускать проверки только при push-событиях в главную ветку main
      - main

# 2. СПИСОК ЗАДАЧ (Что именно нужно сделать?)
jobs:
  # Задача 1: Запуск автоматических проверок стиля кода (линтера)
  tests:
    # Указываем операционную систему для изолированного виртуального сервера (Runner):
    # GitHub автоматически предоставит чистый сервер на базе Ubuntu Linux.
    runs-on: ubuntu-latest

    # Пошаговый план выполнения действий внутри задачи "tests"
    steps:
    # Шаг 1: Клонирование кода репозитория на виртуальный сервер
    # По умолчанию виртуальная машина пустая. Экшен checkout клонирует ваш код в её рабочую директорию.
    - name: Check out code
      uses: actions/checkout@v3

    # Шаг 2: Установка и настройка интерпретатора Python
    # Готовый экшен setup-python разворачивает Python нужной версии в изолированном окружении.
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        # Передаём параметр: точная версия Python, на которой работает наш бэкенд
        python-version: 3.12

    # Шаг 3: Установка утилит и линтеров кода
    # Обновляем менеджер пакетов pip и устанавливаем линтер flake8 с плагином flake8-isort для импортов
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools
        pip install flake8==7.3.0 flake8-isort==7.0.0
        pip install -r ./backend/requirements.txt 

    # Шаг 4: Проверка качества и стандарта оформления Python-кода (PEP 8)
    # Вызываем flake8 только для директории backend/. 
    # Если найдены ошибки оформления, шаг завершится со сбоем (красный крестик на GitHub),
    # что сигнализирует разработчикам о необходимости исправить стиль кода.
    - name: Test with flake8 and django tests
      run: |
        python -m flake8 backend/
        cd backend/
        python manage.py test



